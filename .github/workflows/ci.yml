name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Tier 1 静态验证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 检查 SKILL.md 与模板是否漂移
        run: python3 scripts/gen-skills.py --check

      - name: 11 项静态验证
        run: python3 scripts/validate.py

      - name: 确认脚本里没有网络调用或遥测
        run: |
          # 只看可执行脚本，不看文档措辞
          if grep -rnE 'https?://|\bcurl\b|\bwget\b|socket\.|urllib|requests\.' scripts/*.py scripts/*.sh 2>/dev/null; then
            echo "::error::脚本里出现了网络调用"
            exit 1
          fi
          if grep -rnE 'analytics|\.track\(|telemetry\s*=|phone.?home' scripts/*.py scripts/*.sh 2>/dev/null; then
            echo "::error::脚本里出现了遥测"
            exit 1
          fi
          echo "脚本无网络调用、无遥测"
